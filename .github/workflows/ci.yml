name: CI

# Тесты — на каждый push и pull request.
# Сборка exe и выкладка в Release — при пуше тега вида v1.0.0.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ту же ветку/PR отменяет ещё не завершившийся прогон — не тратим
# раннеры на устаревшие коммиты (сборку по тегу не трогаем — у неё свой ref).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    # Линт и типы платформонезависимы — гоняем на быстром ubuntu без PyQt6.
    # ruff проверяет стиль/импорты, mypy — типы (gui-модули исключены в конфиге).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install linters
        run: pip install "ruff>=0.6" "mypy>=1.11"
      - name: Ruff (style + imports)
        run: ruff check launcher tests
      - name: Mypy (types)
        run: mypy

  test:
    # Windows-раннер: приложение Windows-only (winget, реестр, code.cmd,
    # семантика путей C:\...). На Linux тесты PATH/папок падают не по делу —
    # os.pathsep=':' и нет нормализации '\'/регистра. Тестируем там, где живём.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']   # 3.12 = CI baseline, 3.14 = как у автора
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps (project + dev extras)
        run: pip install .[dev]
      - name: Run tests
        run: python -m pytest

  build:
    # Собираем exe только на тег vX.Y.Z (после успешных тестов).
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # нужно, чтобы action-gh-release мог создать Release (иначе 403)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # exe собираем на той же версии, что у автора
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps (project + dev extras)
        run: pip install .[dev]
      - name: Build exe
        run: pyinstaller packaging/VSCodeLauncher.spec --noconfirm
      - name: SHA256 checksum
        run: (Get-FileHash dist/VSCodeLauncher.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/VSCodeLauncher.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCodeLauncher
          path: |
            dist/VSCodeLauncher.exe
            dist/VSCodeLauncher.exe.sha256
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # авто-описание релиза из коммитов/PR
          files: |
            dist/VSCodeLauncher.exe
            dist/VSCodeLauncher.exe.sha256
